# Adversarial verification — orchestrator file. One independent sonnet verifier per claim, given only the claim + source IDs.
verification: INDEPENDENT (separate agent per claim; not SINGLE-AGENT-DEGRADED)
verifiers: 3   # minimum 3, at least one null — met (V3)
results:
