    finding: "News sitemap (133 URLs) grepped; WP REST (161 posts, 74 pages, 333 events); resources crawl; NEWS PDFs; IMA 2026, AMM 2026; iTunes (~1,580 results); ~20 searches. Only the 2025-11-03 release. Adjacent: named on SHSI's Accessibility Advisory Group page (volunteer committee); 'Kesley Burr' contact line in May–Aug 2026 NEWS."
    source_ids: [W19, W20]
orchestrator_check:
